name: CI

# #745 — CI 헤드리스 게이트 부트스트랩.
#
# 게이트 범위 = CI-결정적 검사만:
#   flutter analyze + route_integrity(#731 Gate 1, 정적 라우트 스캔)
#
# 렌더 기반 게이트(smoke·e2e)는 의도적으로 제외한다 — OS 별 폰트 메트릭 차이로
# 비결정적이다. CI(Linux) 폴백 폰트는 로컬(macOS) 폰트보다 넓어 /lessons 류
# 화면이 렌더 오버플로우로 false-fail 한다(2026-06-19 실측). 렌더 게이트 CI화는
# setUpAll 에서 결정적 폰트 로딩(FontLoader / golden_toolkit) 선행 필요 → #745 후속.
# 전체 `flutter test` 도 별개 이유로 제외: main 기존 red(architecture import 계약·
# BorderRadius·BoxShadow·subscription template).
#
# 참고: .g.dart / l10n generated 는 리포에 커밋되어 있어 build_runner 단계 불필요.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 ref 의 이전 실행은 취소 (러너 비용 절감).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 (게이트는 코드 읽기만 필요).
permissions:
  contents: read

jobs:
  frontend-gate:
    name: Frontend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pubspec.lock: flutter ">=3.38.0" / dart ">=3.10.0" (google_fonts 6.3.3+ 가
      # Dart 3.9+ 요구). 로컬 검증 버전 3.41.6 로 핀(재현성).
      - name: Setup Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze (0 issues 강제)
        run: flutter analyze

      # route_integrity = 정적 스캔(렌더 없음) → OS 무관 결정적. smoke/e2e 는
      # 폰트 메트릭 의존이라 제외(위 주석 참조, #745 후속).
      - name: Gate test — route-integrity (#731 Gate 1, 정적)
        run: flutter test test/core/router/route_integrity_test.dart
