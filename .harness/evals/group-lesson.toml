# group-lesson P1+P2 회귀 eval — spec §2 성공 기준의 기계 검증 게이트
# 실행: python3 .harness/evals/run.py
# 주의: pytest/flutter test 케이스의 테스트 파일은 Phase 5 에서 생성된다 —
#       생성 전에는 FAIL 이 정상(RED). FAIL 을 통과시키려 케이스 완화·삭제 금지.

[eval]
name = "group-lesson"
description = "그룹레슨 P1+P2 — 배선정합·실차감·appliesTo·표시정합·마감·알림 회귀"
spec = ".harness/spec/2026-07-31-group-lesson.md"

# ---------- P1 ----------

[[case]]
name = "p1-6-no-emoji-in-group-screens"
cmd = "rg -n '[\\x{1F000}-\\x{1FAFF}\\x{2705}\\x{274C}\\x{2B50}]|\\x{FE0F}' frontend/lib/features/schedule/presentation/screens/group_class_detail_screen.dart frontend/lib/features/schedule/presentation/screens/group_class_attendance_screen.dart"
expect_exit = 1               # 매치 0건이어야 PASS (rg: no-match = exit 1)

[[case]]
name = "p1-4-applies-to-field-exists"
cmd = "rg -n 'appliesTo' frontend/lib/features/subscription/domain/entities/subscription.dart"
expect_exit = 0

[[case]]
name = "p1-0-groupclass-wiring"
cmd = "cd backend && python -m pytest tests/test_group_class_wiring.py -q"
expect_exit = 0               # GroupClassSchedule → GroupClass 실참조 정합

[[case]]
name = "p1-3-real-deduction-idempotent"
cmd = "cd backend && python -m pytest tests/test_group_lesson_deduction.py -q"
expect_exit = 0               # 출석 확정 → add_usage 실차감 + 중복 멱등 + 범위 검증(1:1 전용권 거부)

[[case]]
name = "p1-5-no-individual-lesson-fallback"
cmd = "cd frontend && flutter test test/features/subscription/group_subscription_display_test.dart"
expect_exit = 0               # 그룹 수강권 = 클래스명 + 그룹 배지, '개인레슨' 폴백 0건

# ---------- P2 ----------

[[case]]
name = "p2-1-deadline-enforced"
cmd = "cd backend && python -m pytest tests/test_group_deadline_enforcement.py -q"
expect_exit = 0               # 마감 후 예약/취소 → 4xx

[[case]]
name = "p2-2-notifications-emit"
cmd = "cd backend && python -m pytest tests/test_group_notifications.py -q"
expect_exit = 0               # 6종 전이 emit (#1207 패턴)

# ---------- 공통 게이트 ----------

[[case]]
name = "gate-flutter-architecture"
cmd = "cd frontend && flutter test test/architecture"
expect_exit = 0
timeout = 300
