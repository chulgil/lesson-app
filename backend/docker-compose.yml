services:
  # --- PostgreSQL 17 ---
  db:
    image: postgres:17-bookworm
    container_name: lessonaza-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lessonaza}
      POSTGRES_USER: ${POSTGRES_USER:-lessonaza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessonaza}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - lessonaza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lessonaza}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- FastAPI Application ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lessonaza-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL for Docker networking
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lessonaza}:${POSTGRES_PASSWORD:-lessonaza}@db:5432/${POSTGRES_DB:-lessonaza}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload in development: mount source code
      - ./app:/app/app
      - app-logs:/app/logs
    networks:
      - lessonaza-network

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: lessonaza-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - lessonaza-network

networks:
  lessonaza-network:
    driver: bridge

volumes:
  pg-data:
    driver: local
  app-logs:
    driver: local
