# ============================================================
# Lessonaza Backend - Beta Docker Compose
# ============================================================
# For codenavi server (108.61.162.25)
# - Uses existing PostgreSQL container on data_internal network
# - Uses Traefik reverse proxy on traefiknet for HTTPS
# - Separate DB (lessonaza_beta) from production
# - Host: api-beta.lessonaza.app
#
# Usage:
#   docker-compose -f docker-compose.beta.yml up -d --build
#   docker-compose -f docker-compose.beta.yml exec app uv run alembic upgrade head
#   docker-compose -f docker-compose.beta.yml exec app uv run python scripts/seed_data.py

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lessonaza-beta-api
    restart: unless-stopped
    env_file:
      - .env.beta
    environment:
      ENVIRONMENT: beta
      # beta 는 production-like 환경(validate_runtime_configuration)이라 DEBUG=true /
      # localhost·http CORS 를 거부한다. 앱 부팅을 위해 안전한 값으로 고정.
      DEBUG: "false"
      # .env.beta 에 CORS_ORIGINS 미설정 → 기본값 ["http://localhost:3000"] 이 검증에
      # 걸리므로 명시. beta 전용 웹 프론트는 없으며 네이티브 앱은 CORS 미적용.
      CORS_ORIGINS: '["https://lesson.chulgil.me"]'
    volumes:
      - beta-logs:/app/logs
      - ./keys:/app/keys:ro
    networks:
      - traefiknet
      - data_internal
    labels:
      - "traefik.enable=true"
      - "traefik.backend=lessonaza-beta-api"
      - "traefik.docker.network=traefiknet"
      - "traefik.frontend.rule=Host:api-beta.lessonaza.app"
      - "traefik.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  traefiknet:
    external: true
  data_internal:
    external: true

volumes:
  beta-logs:
    driver: local
