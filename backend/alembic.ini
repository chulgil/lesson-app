# Alembic Configuration

[alembic]
# Path to migration environment
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate slug field to max 40 chars
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Timezone to use for the revision timestamp
timezone = UTC

# Set to true to search source files recursively in each "version locations" directory
recursive_version_locations = false

# Version path separator (os, :, ;, space)
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Database URL placeholder (overridden by env.py from app.core.config)
sqlalchemy.url = mysql+asyncmy://lesson_app:password@localhost:3306/lesson_app

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
