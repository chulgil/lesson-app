name: lessonaza
description: "Music lesson management app for teachers and students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.0.2  # Notebook × Score 타이포 (Playfair Display, Gaegu, IBM Plex Mono, Noto Serif KR)

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1

  # Deep links (R2 — lessonapp:// 스킴 처리)
  app_links: ^6.3.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.3

  # Authentication
  google_sign_in: ^6.2.1
  # kakao_flutter_sdk_user: ^1.9.5  # TODO: Add when ready

  # Audio
  record: ^6.0.0
  just_audio: ^0.9.39
  audioplayers: ^6.1.0      # For simple audio playback
  flutter_soloud: ^3.4.8    # Low-latency audio engine for metronome
  pitch_detector_dart: ^0.0.7  # YIN algorithm pitch detection
  flutter_audio_capture: ^1.1.6  # Real-time audio capture for tuner
  audio_session: ^0.1.21    # Audio session configuration for iOS/Android

  # Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6
  share_plus: ^12.0.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  file_picker: ^8.0.0+1
  archive: ^3.6.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  json_annotation: ^4.9.0
  package_info_plus: ^8.0.0
  in_app_review: ^2.0.9
  in_app_purchase: ^3.2.0      # #415 R4 Phase C — StoreKit2 / PlayBilling IAP
  youtube_player_iframe: ^5.2.2

  # Charts (practice reports §5.2)
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  hive_test: ^1.0.1
  json_serializable: ^6.8.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/sounds/metronome/pen/
    - assets/sounds/metronome/drum/
    - assets/sounds/metronome/happy_kitten/
    - assets/sounds/metronome/stick/
    - assets/sounds/metronome/woodblock/
    - assets/google_fonts/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
